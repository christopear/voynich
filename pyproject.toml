[project]
name = "voynich-codex-handoff"
version = "0.1.0"
description = "Reproducible structural analysis of the Voynich Manuscript"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.4",
    "requests>=2.31",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "voynich"

[project.scripts]
voynich = "voynich.cli:main"
voynich-lab = "voynich.laboratory.cli:main"
voynich-benchmark = "voynich.laboratory.benchmark:main"
voynich-decipher = "voynich.decipher_search.cli:main"

[tool.ruff]
src = ["src"]
target-version = "py314"
