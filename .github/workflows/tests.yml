name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voynich
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: voynich_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voynich -d voynich_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://voynich:test-only@localhost:5432/voynich_test
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -t . -v
      - run: uv build
